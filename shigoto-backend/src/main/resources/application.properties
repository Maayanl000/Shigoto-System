spring.application.name=Shigoto

# ===============================
# Database Connection Settings
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shigoto}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate Settings
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly opt in to deterministic local demo data.
shigoto.demo-data.enabled=${SHIGOTO_DEMO_DATA_ENABLED:false}

# Artemis broker (local default; override in deployed environments)
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:artemis}
spring.artemis.password=${ARTEMIS_PASSWORD:artemis}

# Optional candidate email notifications (disabled by default)
shigoto.email.enabled=${SHIGOTO_EMAIL_ENABLED:false}
shigoto.email.from=${SHIGOTO_EMAIL_FROM:}
shigoto.frontend-url=${SHIGOTO_FRONTEND_URL:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# Candidate CV Storage
# ===============================
shigoto.storage.cv-directory=${CV_STORAGE_PATH:./data/cvs}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
